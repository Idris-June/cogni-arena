<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · E-Invoicing Game Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--navy:#002285;--blue:#1430FF;--coral:#FF6B4A;--tint:#EEF1FF;--ink:#1A1F36;--quiet:#5B6178;--good:#1F8A4C;--bad:#C0392B;--warn:#B7791F;--k0:#E21B3C;--k1:#1368CE;--k2:#D89E00;--k3:#26890C}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Inter,Arial,sans-serif;color:var(--ink);background:#f4f6fb}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;background:#fff;color:var(--navy);padding:5px 11px;border-radius:8px}.brand span{color:var(--blue)}
header h1{font-size:16px;margin:0;font-weight:600}
.hpin{margin-left:auto;font-weight:800;font-size:18px;background:var(--coral);padding:6px 14px;border-radius:999px}
main{max-width:1360px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
h2{color:var(--navy);margin:0 0 6px;font-size:22px}h3{color:var(--navy);margin:12px 0 6px;font-size:16px}
.sub{color:var(--quiet);margin:0 0 10px;font-size:14px}
button{font-family:inherit;font-weight:600;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--blue);color:#fff}.coral{background:var(--coral);color:#fff}.ghost{background:var(--tint);color:var(--navy)}.good{background:var(--good);color:#fff}.bad{background:var(--bad);color:#fff}
.sm{padding:5px 9px;font-size:13px}.big-btn{font-size:17px;padding:12px 18px}
select,input{font-family:inherit;font-size:14px;padding:8px;border:1px solid #d5daea;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:260px 1fr 300px;gap:14px}@media(max-width:1100px){.layout{grid-template-columns:1fr}}
.day b{display:block;color:var(--navy);font-size:13px;margin:8px 0 4px}
.gbtn{display:block;width:100%;text-align:left;background:var(--tint);color:var(--navy);margin-bottom:5px;font-size:13px}
.gbtn.on{background:var(--blue);color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--navy);font-size:12px;font-weight:700}
.q{font-size:22px;font-weight:800;color:var(--navy);line-height:1.3;margin:8px 0 12px}
.why{background:#e9f6ee;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.note{background:#fff7e8;border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px}
.score{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;background:var(--tint);margin-bottom:6px;font-weight:700}
.score .p{color:var(--blue);font-size:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}.dot.on{background:var(--good)}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--navy);color:#fff;text-align:left;padding:7px}td{border-bottom:1px solid #e3e6ef;padding:7px;vertical-align:top}
.code{font-family:Consolas,monospace;font-size:13px;background:#0f1636;color:#e6ebff;padding:6px 10px;border-radius:6px;white-space:pre-wrap;word-break:break-all;flex:1}
.line{display:flex;gap:8px;align-items:center;margin-bottom:5px}.line .n{font-weight:800;color:var(--navy);width:26px}.line.bug .code{outline:3px solid var(--good)}
.timer{font-size:30px;font-weight:800;color:var(--coral);font-variant-numeric:tabular-nums}
.jb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.jh{background:var(--navy);color:#fff;text-align:center;font-weight:800;padding:10px 4px;border-radius:8px;font-size:13px}
.jc{background:var(--blue);color:#FFD34D;font-size:20px;font-weight:800;padding:14px 0}.jc.done{background:#dfe3f3;color:#9aa2c4;opacity:1;text-decoration:line-through}#dsel{width:100%;max-width:100%}
.ans{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border:1px solid #e3e6ef;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.chip{display:inline-block;background:var(--tint);color:var(--navy);padding:6px 12px;border-radius:999px;margin:4px;font-weight:700}
.hidden{display:none}
/* presenter */
.stage{display:grid;grid-template-columns:1fr 300px;gap:14px}@media(max-width:1000px){.stage{grid-template-columns:1fr}}
.big{font-size:20px}.big .q{font-size:40px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{color:#fff;padding:18px;border-radius:10px;font-weight:700;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt.c0{background:var(--k0)}.opt.c1{background:var(--k1)}.opt.c2{background:var(--k2)}.opt.c3{background:var(--k3)}.opt.dim{opacity:.35}.opt.right{outline:5px solid #fff;box-shadow:0 0 0 8px var(--good)}
.opt .cnt{background:rgba(255,255,255,.25);padding:2px 12px;border-radius:999px}
.bigpin{font-size:96px;font-weight:900;color:var(--navy);letter-spacing:8px;text-align:center;margin:8px 0}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-top:20px}
.pod{background:var(--blue);color:#fff;border-radius:12px 12px 0 0;width:200px;text-align:center;padding:14px 8px;font-weight:800}
.pod .nm{font-size:22px}.pod .pt{font-size:18px;opacity:.9}
.bar{height:26px;background:var(--blue);border-radius:6px;color:#fff;font-weight:700;padding:2px 8px;min-width:30px}
.lock{max-width:420px;margin:60px auto}
footer{text-align:center;color:var(--quiet);font-size:12px;padding:14px}
.rep{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px solid #eef0f6}
.tally{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}.tally th,.tally td{border:1px solid #e3e6ef;padding:6px 8px;text-align:left}.tally th{background:var(--tint);color:var(--navy)}
.lkmodal{position:fixed;inset:0;background:rgba(10,16,48,.55);z-index:50;padding:10px;overflow:auto}.lkmodal input{width:100%;box-sizing:border-box;margin-bottom:8px}
</style>
</head>

const SCREEN = location.hash === "#screen";
const SHELL = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const ch = ("BroadcastChannel" in window) ? new BroadcastChannel("cogni-host-unlock") : null;
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
let SRC = null;

async function keyFrom(code, salt, iter, use) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, [use]);
}
async function unlock(code) {
  const key = await keyFrom(code, b64(LOCK.salt), LOCK.iter, "decrypt");
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCK.iv) }, key, b64(LOCK.ct));
  return new TextDecoder().decode(pt);
}
async function lockWith(code, src) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = LOCK.iter;
  const key = await keyFrom(code, salt, iter, "encrypt");
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(src)));
  return { v: 1, iter, salt: tob64(salt), iv: tob64(iv), ct: tob64(ct) };
}
function boot(src) {
  if (SRC) return; SRC = src;
  const s = document.createElement("script"); s.textContent = src; document.body.appendChild(s);
  if (!SCREEN) addChangeButton();
}
if (ch) ch.onmessage = e => {
  const d = e.data || {};
  if (SCREEN && d.t === "src" && !SRC) boot(d.src);
  if (!SCREEN && d.t === "need" && SRC) ch.postMessage({ t: "src", src: SRC });
};

/* ---------- presenter: waits for the unlocked host in this browser ---------- */
if (SCREEN) {
  $("#app").innerHTML = '<div class="card big"><div class="q" style="text-align:center;margin-top:40px">The session starts soon.</div></div>';
  if (ch) { ch.postMessage({ t: "need" }); const iv = setInterval(() => { if (SRC) clearInterval(iv); else ch.postMessage({ t: "need" }); }, 1500); }
  return;
}

/* ---------- host: admin code screen ---------- */
function showLock(msg) {
  $("#app").innerHTML = `<div class="card lock"><h2>Admin sign-in</h2><p class="sub">Only the host can open the control panel.</p>
  <div class="row"><input id="code" type="password" placeholder="Admin code" autocomplete="current-password" style="flex:1"><button class="primary" id="go">Enter</button></div>
  <p class="sub" id="err" style="color:var(--bad)">${msg || ""}</p></div>`;
  const go = async () => {
    const v = $("#code").value; if (!v) return;
    $("#go").disabled = true; $("#err").style.color = "var(--quiet)"; $("#err").textContent = "Checking…";
    try { const src = await unlock(v); boot(src); if (ch) ch.postMessage({ t: "src", src }); }
    catch (_) { $("#go").disabled = false; $("#err").style.color = "var(--bad)"; $("#err").textContent = "Wrong code."; $("#code").select(); }
  };
  $("#go").onclick = go; $("#code").onkeydown = e => { if (e.key === "Enter") go(); }; $("#code").focus();
}
if (!window.crypto || !crypto.subtle) { showLock("This browser can't open the locked file. Use Chrome or Edge, from the GitHub link or a file on your laptop."); return; }
showLock();

/* ---------- change admin code ---------- */
function addChangeButton() {
  const b = document.createElement("button"); b.className = "ghost sm"; b.textContent = "Change admin code"; b.style.marginLeft = "10px";
  b.onclick = openChange; const h = document.querySelector("header"); const pin = $("#hpin"); h.insertBefore(b, pin && pin.nextSibling);
}
function openChange() {
  const bg = document.createElement("div"); bg.className = "lkmodal";
  bg.innerHTML = `<div class="card" style="max-width:460px;margin:80px auto"><h2>Change admin code</h2>
  <p class="sub">This makes a new <b>cogni-host.html</b> locked with your new code. Upload it to GitHub in place of the old file. The current file keeps working with the old code until you replace it.</p>
  <div class="field"><input id="oc" type="password" placeholder="Current code" autocomplete="current-password"></div>
  <div class="field"><input id="nc" type="password" placeholder="New code (at least 8 characters)" autocomplete="new-password"></div>
  <div class="field"><input id="nc2" type="password" placeholder="Type the new code again" autocomplete="new-password"></div>
  <p class="sub" id="cerr" style="color:var(--bad)"></p>
  <div class="row"><button class="primary" id="cgo">Create new file</button><button class="ghost" id="cx">Cancel</button></div></div>`;
  document.body.appendChild(bg);
  const err = t => { $("#cerr").style.color = "var(--bad)"; $("#cerr").textContent = t; };
  $("#cx").onclick = () => bg.remove();
  $("#oc").focus();
  $("#cgo").onclick = async () => {
    const oc = $("#oc").value, nc = $("#nc").value, nc2 = $("#nc2").value;
    try { await unlock(oc); } catch (_) { return err("The current code is wrong."); }
    if (nc.length < 8) return err("Use at least 8 characters.");
    if (!/[A-Za-z]/.test(nc) || !/[0-9]/.test(nc)) return err("Mix letters and numbers.");
    if (nc !== nc2) return err("The two new codes don't match.");
    if (nc === oc) return err("Pick a code different from the current one.");
    $("#cgo").disabled = true; $("#cerr").style.color = "var(--quiet)"; $("#cerr").textContent = "Locking…";
    const lock = await lockWith(nc, SRC);
    const html = SHELL.replace(/\/\*LOCK\*\/[\s\S]*?\/\*\/LOCK\*\//, "/*LOCK*/" + JSON.stringify(lock) + "/*/LOCK*/");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = "cogni-host.html";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    $("#cerr").style.color = "var(--good)"; $("#cerr").innerHTML = "Done. The new <b>cogni-host.html</b> is in your Downloads. Upload it to GitHub to replace the old one.";
    $("#cgo").remove(); $("#cx").textContent = "Close";
  };
}
})();
